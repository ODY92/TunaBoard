[package]
name = "tuna-board"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Soundboard Linux native pour les sons communautaires de Voicemod Tuna"
license = "MIT"

[dependencies]
anyhow = "1"
gtk = "0.18.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

